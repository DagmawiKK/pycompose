default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: ^pycompose/
        additional_dependencies: [types-jsonschema]

  - repo: https://github.com/jsh9/pydoclint
    rev: 0.11.0
    hooks:
      - id: pydoclint

  - repo: https://github.com/seddonym/import-linter
    rev: v2.0
    hooks:
      - id: import-linter
        name: import-linter (python boundaries)
        args: ["--config", "pyproject.toml"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: spotless-check
        name: Spotless check (Kotlin)
        language: system
        entry: bash -c 'cd android && ./gradlew spotlessCheck --no-build-cache'
        files: \.(kt|kts)$
        pass_filenames: false
      - id: detekt
        name: Detekt (Kotlin)
        language: system
        entry: bash -c 'cd android && ./gradlew detekt --no-build-cache'
        files: \.(kt|kts)$
        pass_filenames: false
      - id: codegen-check
        name: Registry codegen --check
        language: system
        entry: bash -c 'if [ -x .venv/bin/python ]; then exec .venv/bin/python tools/schema/gen.py --check; fi; exec python tools/schema/gen.py --check'
        files: ^(schema/catalog\.lock\.json|tools/schema/|pycompose/m3/|pycompose/ir/generated_|pycompose/bridge/generated_|android/ir/src/main/kotlin/com/pycompose/ir/generated/|pycompose/templates/android/ir/src/main/kotlin/com/pycompose/ir/generated/)
        pass_filenames: false
      - id: template-check
        name: Native template drift check
        language: system
        entry: bash -c 'if [ -x .venv/bin/python ]; then exec .venv/bin/python tools/template/sync.py --check; fi; exec python tools/template/sync.py --check'
        files: ^(android/|pycompose/templates/android/|tools/template/)
        pass_filenames: false
      - id: actionlint
        name: actionlint (workflow files)
        language: system
        entry: actionlint
        files: ^\.github/workflows/
      - id: line-budgets
        name: Line budgets (ADR-0015)
        language: system
        entry: bash -c 'if [ -x .venv/bin/python ]; then exec .venv/bin/python tools/limits.py; fi; exec python tools/limits.py'
        files: \.(py|kt)$
      - id: commitlint
        name: commitlint (semantic commit messages)
        language: system
        entry: bash -c 'exec npx --no-install commitlint --edit "$1"' --
        stages: [commit-msg]
