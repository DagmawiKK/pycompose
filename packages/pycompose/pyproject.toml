[build-system]
requires = ["setuptools>=68"]
# setuptools, after assembling the package's copied assets (tools/template/sync.py).
build-backend = "backend"
backend-path = ["_build"]

[project]
name = "pycompose"
description = "A Python UI library for Android (Jetpack Compose Material 3)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dynamic = ["version"]
# The runtime needs nothing beyond the standard library: it is what ships to a phone.
dependencies = []

[project.optional-dependencies]
# The command line: init, run, build and release (the `pycompose` command).
cli = ["pycompose-cli"]
# The headless test driver, for an app's own tests.
testing = ["pycompose-testing"]
dev = [
    "bandit>=1.7",
    "hypothesis>=6.100",
    "httpx>=0.27,<0.29",
    "import-linter==2.0",
    "jsonschema>=4.20",
    "mypy==1.11.2",
    "pillow==11.0.0",
    "pre-commit>=3.0",
    "pydoclint>=0.5",
    "pyperf>=2.7,<3",
    "pytest>=8.0",
    "ruff==0.6.9",
    "types-jsonschema>=4.20",
    "types-defusedxml>=0.7",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["pycompose", "pycompose.*"]

[tool.setuptools.package-data]
pycompose = ["py.typed", "contract/catalog.lock.json"]

[tool.setuptools.dynamic]
version = { attr = "pycompose.version.__version__" }

[tool.uv.sources]
pycompose-cli = { workspace = true }
pycompose-testing = { workspace = true }
