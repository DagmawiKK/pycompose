[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pycompose-testing"
description = "Test PyCompose apps with no device: a headless host and deterministic time."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dynamic = ["version"]
dependencies = ["pycompose"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pycompose_testing*"]

[tool.setuptools.package-data]
pycompose_testing = ["fixtures/*.json"]

[tool.setuptools.dynamic]
version = { attr = "pycompose_testing.__version__" }

[tool.uv.sources]
pycompose = { workspace = true }
