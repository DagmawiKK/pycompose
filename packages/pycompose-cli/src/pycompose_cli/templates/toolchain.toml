# The toolchain one PyCompose release is tested with (plan 31 §21.5).
#
# Gradle (with its distribution checksum), AGP, Kotlin, the Compose BOM and the
# SDK levels are pinned by the Android template itself; `pycompose_cli.toolchain`
# reads them from there, so they have one source. What `pycompose setup`
# installs beside them is pinned here, each archive with its publisher's digest.

[jdk]
version = "17"
release = "Eclipse Temurin"

[jdk.archives]
mac-aarch64 = { url = "https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.21%2B9/OpenJDK17U-jdk_aarch64_mac_hotspot_17.0.21_9.tar.gz", sha256 = "78b08c7f5a0598242d5719c022e19479cb4a3aa45c37c19726a757a469ed1c15" }
