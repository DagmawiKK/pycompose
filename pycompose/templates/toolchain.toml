# The toolchain one PyCompose release is tested with (plan 31 §21.5).
#
# Gradle (with its distribution checksum), AGP, Kotlin, the Compose BOM and the
# SDK levels are pinned by the Android template itself; `pycompose.cli.toolchain`
# reads them from there, so they have one source. What `pycompose setup`
# installs beside them is pinned here, each archive with its publisher's digest.

[jdk]
version = "17"
release = "Eclipse Temurin"

[jdk.archives]
mac-aarch64 = { url = "https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.21%2B9/OpenJDK17U-jdk_aarch64_mac_hotspot_17.0.21_9.tar.gz", sha256 = "78b08c7f5a0598242d5719c022e19479cb4a3aa45c37c19726a757a469ed1c15" }
mac-x64 = { url = "https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.20.1%2B1/OpenJDK17U-jdk_x64_mac_hotspot_17.0.20.1_1.tar.gz", sha256 = "c01975da12ed4235250ff891fe8bba73a9e73037d444b269c9d0922b5dbc8e0a" }
linux-x64 = { url = "https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.21%2B9/OpenJDK17U-jdk_x64_linux_hotspot_17.0.21_9.tar.gz", sha256 = "8b9b611d917e3dfd8419d3566b5949226f69b052fed7e109c1368add1dfe8711" }
linux-aarch64 = { url = "https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.20.1%2B1/OpenJDK17U-jdk_aarch64_linux_hotspot_17.0.20.1_1.tar.gz", sha256 = "457b57af8f9c93ec39080bb8c764f559dc8c89a6da1a39d718a400b7890d3e41" }
windows-x64 = { url = "https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.20.1%2B1/OpenJDK17U-jdk_x64_windows_hotspot_17.0.20.1_1.zip", sha256 = "e53a79c3c3d86865bd7e787903884331068e71321714ffd44f145785affc7cb0" }

[android]
# Google's repository publishes SHA-1 digests for these archives.
cmdline_tools = "23.0"
build_tools = "36.0.0"
platform = "android-37.0"
system_image = "android-36.1;google_apis_playstore"

