[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pycompose"
description = "A Python UI library for Android (Jetpack Compose Material 3)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dynamic = ["version"]
dependencies = ["rich>=13.7", "packaging>=24", "defusedxml>=0.7"]

[project.scripts]
pycompose = "pycompose.cli.main:main"

[project.optional-dependencies]
httpx = ["httpx>=0.27,<0.29"]
dev = [
    "bandit>=1.7",
    "hypothesis>=6.100",
    "httpx>=0.27,<0.29",
    "import-linter==2.0",
    "jsonschema>=4.20",
    "mypy==1.11.2",
    "pre-commit>=3.0",
    "pydoclint>=0.5",
    "pyperf>=2.7,<3",
    "pytest>=8.0",
    "ruff==0.6.9",
    "types-jsonschema>=4.20",
    "types-defusedxml>=0.7",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["pycompose*"]
exclude = ["pycompose.templates*"]

[tool.setuptools.package-data]
pycompose = ["py.typed", "schema/components.json", "schema/ir.schema.json", "integrations/definitions/*.toml", "testing/fixtures/*.json", "templates/android/**/*", "templates/android/.gitignore", "templates/android/.editorconfig", "templates/android/**/.gitkeep"]

[tool.setuptools.dynamic]
version = { attr = "pycompose.version.__version__" }

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["templates", "build", ".venv", "venv", "docs"]

[tool.ruff.lint]
# PEP 8 policy: E/W are the PEP 8 (pycodestyle) core rules, N is
# pep8-naming, D-style docstring checks are delegated to pydoclint
# (below). line-length 88 is the project standard (within PEP 8's
# modern 99-char allowance).
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ARG", "RUF", "PIE", "PL", "TID", "ERA", "PERF"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
# Handlers here exist to be introspected, not run. An unused parameter is the
# point: it is what proves the signature is parsed and nothing else is.
"tests/test_auto_ids.py" = ["ARG001"]
"tests/test_container_injection.py" = ["ARG001"]
# Same reason: these actions exist to be counted and named, not dispatched.
"tests/test_registry.py" = ["ARG001"]
# Optional fields exist to prove their contracts; the handler reads only one.
"tests/test_action_payload_validation.py" = ["ARG001"]

[tool.ruff.lint.isort]
known-first-party = ["pycompose"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["templates/android", "build"]

[tool.importlinter]
root_packages = ["pycompose", "tools"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered: core -> schema/state -> ir -> bridge -> components"
type = "layers"
layers = ["cli", "testing", "m3", "composition", "components", "bridge", "integrations", "extensions", "async_task", "repository", "ir", "state", "schema", "core", "utils"]
containers = ["pycompose"]
explanation = "components depends on ir+core+registry; no cycles, no skips."

[[tool.importlinter.contracts]]
name = "Extensions are consumers, never privileged core dependencies"
type = "forbidden"
source_modules = ["pycompose.extensions", "pycompose.bridge", "pycompose.async_task",
                  "pycompose.repository", "pycompose.cli"]
forbidden_modules = ["pycompose.integrations"]
explanation = "Recipe discovery reads data; core never imports a concrete extension."

[[tool.importlinter.contracts]]
name = "Bridge is the only runtime boundary surface"
type = "forbidden"
source_modules = ["pycompose.bridge"]
# plan 09 words com.android/com.chaquo as forbidden; import-linter only accepts
# top-level external modules, so `com` covers every com.* Android/Chaquopy import.
forbidden_modules = ["android", "com", "kotlinx", "gradle"]
explanation = "Python bridge surface is Chaquopy-agnostic; the host implements transport."

[[tool.importlinter.contracts]]
name = "Runtime packages never import CLI or templates"
type = "forbidden"
source_modules = ["pycompose.core", "pycompose.schema", "pycompose.state",
                  "pycompose.ir", "pycompose.bridge", "pycompose.components",
                   "pycompose.utils", "pycompose.testing", "pycompose.m3", "pycompose.composition", "pycompose.async_task",
                    "pycompose.repository", "pycompose.extensions", "pycompose.integrations"]
forbidden_modules = ["pycompose.cli", "pycompose.templates"]
explanation = "CLI and template assets are dev/tooling concerns, never runtime deps."

[[tool.importlinter.contracts]]
name = "State is independent (no ir/bridge/components deps)"
type = "forbidden"
source_modules = ["pycompose.state"]
forbidden_modules = ["pycompose.ir", "pycompose.bridge", "pycompose.components"]
explanation = "State + Store stay minimal and purpose-free."

[[tool.importlinter.contracts]]
name = "Runtime never imports testing helpers or fixtures"
type = "forbidden"
source_modules = ["pycompose.core", "pycompose.schema", "pycompose.state",
                   "pycompose.ir", "pycompose.bridge", "pycompose.components",
                   "pycompose.utils", "pycompose.m3", "pycompose.composition", "pycompose.async_task",
                    "pycompose.repository", "pycompose.extensions", "pycompose.integrations"]
forbidden_modules = ["pycompose.testing"]
explanation = "Testing consumes runtime public APIs; runtime stays independent of test data."

[[tool.importlinter.contracts]]
name = "CLI does not depend on testing helpers"
type = "forbidden"
source_modules = ["pycompose.cli"]
forbidden_modules = ["pycompose.testing"]
explanation = "The CLI ships independent project assets, not test fixture builders."

[[tool.importlinter.contracts]]
name = "No Android/Kotlin/Chaquopy imports anywhere in runtime"
type = "forbidden"
source_modules = ["pycompose"]
# Same top-level-external-module constraint as the bridge contract above; `com`
# covers com.google.android / com.chaquo from plan 09. plan 09 also listed
# ignore_imports = ["pycompose.templates.* -> *"]; that never matches until
# templates/ contains importing modules, and import-linter fails on unmatched
# ignores — add it back when templates/ lands.
forbidden_modules = ["android", "kotlinx", "com", "gradle"]
explanation = "Python runtime is host-agnostic by construction (ADR-0004)."

[[tool.importlinter.contracts]]
name = "Tools import the library; never the reverse"
type = "layers"
layers = ["tools", "pycompose"]
explanation = """tools/ is repo-only tooling: it may read the library it serves (the
classpath readers, drift checkers and proposals are built on registry internals), and the
runtime never learns tools/ exists. Before tools.schema was a real package the gate could
not see this direction at all."""

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hot_reload_smoke: dev-server hot reload smoke (CI job 6)",
]

[tool.pydoclint]
# Google-style docstrings, required for the runtime/public API (plan 06).
# Types live in signatures/annotations, so docstrings carry descriptions only;
# the docstring type-hint checks are off to avoid demanding redundant types.
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
allow-init-docstring = true
