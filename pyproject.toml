# The repository is a uv workspace (ADR-0063): each distribution lives under
# packages/ with its own pyproject.toml and src/. This root holds no package,
# only the workspace and the tool settings every member shares.
[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["templates", "build", ".venv", "venv", "docs"]

[tool.ruff.lint]
# PEP 8 policy: E/W are the PEP 8 (pycodestyle) core rules, N is
# pep8-naming, D-style docstring checks are delegated to pydoclint
# (below). line-length 88 is the project standard (within PEP 8's
# modern 99-char allowance).
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ARG", "RUF", "PIE", "PL", "TID", "ERA", "PERF"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Runtime code reaches time, randomness, ids, tasks and threads only through
# pycompose.runtime's scheduler, so a test can replace all of them at once.
"time.time".msg = "use the session scheduler's now()"
"uuid.uuid4".msg = "draw ids from the session scheduler's random()"
"random".msg = "use the session scheduler's random()"
"threading.Thread".msg = "run work through the session scheduler"
"concurrent.futures.ThreadPoolExecutor".msg = "use the session scheduler's to_thread()"
"asyncio.create_task".msg = "spawn tasks in a supervised scope"
"asyncio.ensure_future".msg = "spawn tasks in a supervised scope"

[tool.ruff.lint.per-file-ignores]
# The scheduler's own home, and desktop-only code, may use them directly.
"packages/pycompose/src/pycompose/runtime/**" = ["TID251"]
"packages/pycompose-testing/src/**" = ["TID251"]
"packages/pycompose-cli/src/**" = ["TID251"]
"packages/pycompose-codegen/src/**" = ["TID251"]
"tests/**" = ["TID251"]
"tools/**" = ["TID251"]
# Handlers here exist to be introspected, not run. An unused parameter is the
# point: it is what proves the signature is parsed and nothing else is.
"tests/test_auto_ids.py" = ["ARG001"]
"tests/test_container_injection.py" = ["ARG001"]
# Same reason: these actions exist to be counted and named, not dispatched.
"tests/test_registry.py" = ["ARG001"]
# Optional fields exist to prove their contracts; the handler reads only one.
"tests/test_action_payload_validation.py" = ["ARG001"]

[tool.ruff.lint.isort]
known-first-party = ["pycompose"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["templates", "build"]

[tool.importlinter]
root_packages = ["pycompose", "pycompose_cli", "pycompose_codegen", "pycompose_testing", "tools"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered: core -> schema/state -> ir -> bridge -> components"
type = "layers"
layers = ["blocks", "m3", "material3", "foundation", "ui", "bridge", "app", "extensions", "runtime", "storage", "wire", "state", "schema", "core", "contract", "utils"]
containers = ["pycompose"]
explanation = "components depends on ir+core+registry; no cycles, no skips."

[[tool.importlinter.contracts]]
name = "Bridge is the only runtime boundary surface"
type = "forbidden"
source_modules = ["pycompose.bridge"]
# plan 09 words com.android/com.chaquo as forbidden; import-linter only accepts
# top-level external modules, so `com` covers every com.* Android/Chaquopy import.
forbidden_modules = ["android", "com", "kotlinx", "gradle"]
explanation = "Python bridge surface is Chaquopy-agnostic; the host implements transport."

[[tool.importlinter.contracts]]
name = "Runtime packages never import CLI or templates"
type = "forbidden"
source_modules = ["pycompose.core", "pycompose.contract", "pycompose.schema", "pycompose.state", "pycompose.runtime", "pycompose.app",
                  "pycompose.blocks", "pycompose.wire", "pycompose.bridge", "pycompose.ui",
                   "pycompose.utils", "pycompose.m3", "pycompose.foundation", "pycompose.material3",
                    "pycompose.storage", "pycompose.extensions", "pycompose.repository", "pycompose.media"]
forbidden_modules = ["pycompose_cli"]
explanation = "CLI and template assets are desktop concerns, never runtime deps."

[[tool.importlinter.contracts]]
name = "State is independent (no ir/bridge/components deps)"
type = "forbidden"
source_modules = ["pycompose.state"]
forbidden_modules = ["pycompose.wire", "pycompose.bridge", "pycompose.ui"]
explanation = "State + Store stay minimal and purpose-free."

[[tool.importlinter.contracts]]
name = "Runtime never imports testing helpers or fixtures"
type = "forbidden"
source_modules = ["pycompose.core", "pycompose.contract", "pycompose.schema", "pycompose.state", "pycompose.runtime", "pycompose.app",
                   "pycompose.blocks", "pycompose.wire", "pycompose.bridge", "pycompose.ui",
                   "pycompose.utils", "pycompose.m3", "pycompose.foundation", "pycompose.material3",
                    "pycompose.storage", "pycompose.extensions", "pycompose.repository", "pycompose.media"]
forbidden_modules = ["pycompose_testing"]
explanation = "Testing consumes runtime public APIs; runtime stays independent of test data."

[[tool.importlinter.contracts]]
name = "CLI does not depend on testing helpers"
type = "forbidden"
source_modules = ["pycompose_cli"]
forbidden_modules = ["pycompose_testing"]
explanation = "The CLI ships independent project assets, not test fixture builders."

[[tool.importlinter.contracts]]
name = "No Android/Kotlin/Chaquopy imports anywhere in runtime"
type = "forbidden"
source_modules = ["pycompose"]
# Same top-level-external-module constraint as the bridge contract above; `com`
# covers com.google.android / com.chaquo from plan 09.
forbidden_modules = ["android", "kotlinx", "com", "gradle"]
explanation = "Python runtime is host-agnostic by construction (ADR-0004)."

[[tool.importlinter.contracts]]
name = "The runtime never imports tool or extension packages"
type = "forbidden"
source_modules = ["pycompose"]
forbidden_modules = ["pycompose_cli", "pycompose_codegen", "pycompose_testing", "pycompose_sqlite", "pycompose_http", "pycompose_pillow"]
explanation = """Only the runtime ships to a device: tool packages run on the developer's machine,
and extensions adapt libraries on top of the runtime's public API (ADR-0063)."""

[[tool.importlinter.contracts]]
name = "Codegen: derive the catalog, then emit from it"
type = "layers"
layers = ["derive", "emit", "checkout"]
containers = ["pycompose_codegen"]
explanation = "derive writes the lock that emit reads; both find the checkout the same way."

[[tool.importlinter.contracts]]
name = "Codegen reads the runtime's catalog, never its machinery"
type = "forbidden"
source_modules = ["pycompose_codegen"]
forbidden_modules = ["pycompose.app", "pycompose.blocks", "pycompose.bridge", "pycompose.runtime", "pycompose.state", "pycompose.wire", "pycompose.ui", "pycompose.m3", "pycompose.foundation", "pycompose.material3", "pycompose.composition", "pycompose.storage", "pycompose.repository", "pycompose.media", "pycompose.extensions", "pycompose_testing", "pycompose_cli"]
explanation = """It generates code from the catalog's types and rules; running an app is not its
concern, so it imports only pycompose.contract, pycompose.core and pycompose.errors (ADR-0063)."""

[[tool.importlinter.contracts]]
name = "Tools import the library; never the reverse"
type = "layers"
layers = ["tools", "pycompose_testing", "pycompose_cli", "pycompose_codegen", "pycompose"]
explanation = """tools/ is repo-only tooling: it may read the library it serves (previews, the
corpus and the template sync are built on registry internals), and the runtime never learns tools/ exists."""

[tool.pytest.ini_options]
testpaths = ["tests"]
# Our own code never imports a moved module's old name; a test that checks a
# shim on purpose captures the warning with pytest.warns.
filterwarnings = ["error:.* moved to pycompose:DeprecationWarning"]
markers = [
    "hot_reload_smoke: dev-server hot reload smoke (CI job 6)",
]

[tool.pydoclint]
# Google-style docstrings, required for the runtime/public API (plan 06).
# Types live in signatures/annotations, so docstrings carry descriptions only;
# the docstring type-hint checks are off to avoid demanding redundant types.
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
allow-init-docstring = true
