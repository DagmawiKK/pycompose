name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  JDK_VERSION: "17"

jobs:
  python-lint-typecheck-test:
    name: 1 · Python lint · typecheck · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Actionlint (workflow files)
        uses: rhysd/actionlint@v1
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: mypy
        run: mypy pycompose
      - name: Bandit
        run: bandit -ll -q -r pycompose
      - name: pydoclint (Google-style docstrings)
        run: pydoclint pycompose
      - name: import-linter (blocking boundary gate)
        run: lint-imports --config pyproject.toml
      - name: pytest
        run: pytest -q --junitxml=reports/pytest.xml
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: python-reports
          path: reports/

  schema-validate-codegen:
    name: 2 · Schema validate + codegen --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Codegen drift check
        run: python tools/schema/gen.py --check
      - name: Schema + golden tests
        run: pytest -q -k "schema or golden"
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: schema-reports
          path: reports/

  kotlin-lint-test-archunit:
    name: 3 · Kotlin lint · tests · ArchUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: hashFiles('android/settings.gradle.kts') != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VERSION }}
      - if: hashFiles('android/settings.gradle.kts') != ''
        uses: gradle/actions/setup-gradle@v4
      - name: Spotless + Detekt + lint + unit tests (incl. ArchUnit)
        if: hashFiles('android/settings.gradle.kts') != ''
        run: ./gradlew spotlessCheck detekt lintDebug testDebugUnitTest --continue
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-reports
          path: android/**/build/reports/

  build-template-smoke:
    name: 4 · Template build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - if: hashFiles('pycompose/templates/android/settings.gradle.kts') != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VERSION }}
      - if: hashFiles('pycompose/templates/android/settings.gradle.kts') != ''
        uses: gradle/actions/setup-gradle@v4
      - name: Install CLI
        run: pip install -e ".[dev]"
      - name: Generate sample project
        if: hashFiles('pycompose/templates/android/settings.gradle.kts') != ''
        run: |
          cd "$RUNNER_TEMP"
          pycompose init smoke
      - name: Build template (host debug APK)
        if: hashFiles('pycompose/templates/android/settings.gradle.kts') != ''
        working-directory: ${{ runner.temp }}/smoke
        run: ./gradlew :host:assembleDebug

  resource-sync-check:
    name: 5 · Resource sync --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install CLI
        run: pip install -e ".[dev]"
      - name: Sync check
        if: hashFiles('pycompose/cli/sync.py') != ''
        run: pycompose sync --check

  hot-reload-smoke:
    name: 6 · Dev-server hot reload smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install CLI
        run: pip install -e ".[dev]"
      - name: Hot reload smoke
        run: pytest -q -m "hot_reload_smoke"
