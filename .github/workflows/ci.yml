name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every distribution's source: what the Python checks cover.
  PY_SRC: packages/pycompose/src/pycompose packages/pycompose-cli/src/pycompose_cli packages/pycompose-codegen/src/pycompose_codegen packages/pycompose-testing/src/pycompose_testing
  PYTHON_VERSION: "3.12"
  JDK_VERSION: "17"

jobs:
  python-lint-typecheck-test:
    name: 1 · Python lint · typecheck · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The line budgets count a file's growth from the change's base.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: |
          uv sync --all-packages --all-extras --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Actionlint (workflow files)
        shell: bash
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: mypy
        run: |
          # shellcheck disable=SC2086 # one path per package, split on purpose
          mypy $PY_SRC
      - name: Bandit
        run: |
          # shellcheck disable=SC2086 # one path per package, split on purpose
          bandit -ll -q -r $PY_SRC
      - name: pydoclint (Google-style docstrings)
        run: |
          # shellcheck disable=SC2086 # one path per package, split on purpose
          pydoclint $PY_SRC
      - name: import-linter (blocking boundary gate)
        run: lint-imports --config pyproject.toml
      - name: Line budgets (ADR-0015)
        env:
          # A pull request grows from its base; a push from the commit before it.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/limits.py --base "${BASE:-HEAD}"
      - name: pytest
        run: pytest -q --junitxml=reports/pytest.xml
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: python-reports
          path: reports/

  schema-validate-codegen:
    name: 2 · Schema validate + codegen --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The classified lock diff reads the base commit's lock.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: |
          uv sync --all-packages --all-extras --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Codegen drift check
        run: python tools/schema/gen.py --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VERSION }}
      - name: Protocol model check (TLA+)
        run: python tools/spec/check.py
      - name: Classified lock diff (behaviour and breaking changes need approval)
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BASE}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          python -m pycompose_codegen.derive diff --base "$base"
      - name: Package asset assembly (template, extractor, lock copies)
        run: pytest -q tests/test_template_parity.py
      - name: Schema + golden tests
        run: pytest -q -k "schema or golden"
      - name: Verify goldens ship in the wheel
        run: |
          uv build --all-packages --out-dir "$RUNNER_TEMP/pycompose-wheel"
          python -I - tools/wheel_smoke.py "$RUNNER_TEMP/pycompose-wheel"
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: schema-reports
          path: reports/

  ir-performance-report:
    name: IR performance · informational
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install measurement dependencies
        run: pip install -e "./packages/pycompose[dev]" -e ./packages/pycompose-cli -e ./packages/pycompose-codegen -e ./packages/pycompose-testing
      - name: Prepare matched baseline
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BASE}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          git worktree add --detach "$RUNNER_TEMP/ir-baseline" "$base"
          cp tools/bench_ir.py "$RUNNER_TEMP/ir-baseline/tools/bench_ir.py"
          mkdir -p reports/ir-performance
          git rev-parse "$base" HEAD > reports/ir-performance/revisions.txt
      - name: Before and after timing
        run: |
          python "$RUNNER_TEMP/ir-baseline/tools/bench_ir.py" --processes 6 --values 8 --warmups 2 --min-time 0.05 --quiet -o reports/ir-performance/before.json
          python tools/bench_ir.py --processes 6 --values 8 --warmups 2 --min-time 0.05 --quiet -o reports/ir-performance/after.json
          python -m pyperf compare_to reports/ir-performance/before.json reports/ir-performance/after.json --table > reports/ir-performance/comparison.txt
      - name: Phase timing
        run: |
          PHASES=construction,emit,validate,bytes,diff,patch,patch_pipeline
          python "$RUNNER_TEMP/ir-baseline/tools/bench_ir.py" --phases "$PHASES" --processes 3 --values 5 --min-time 0.03 --quiet -o reports/ir-performance/before-phases.json
          python tools/bench_ir.py --phases "$PHASES" --processes 3 --values 5 --min-time 0.03 --quiet -o reports/ir-performance/after-phases.json
      - name: Separate memory measurements
        run: |
          python "$RUNNER_TEMP/ir-baseline/tools/bench_ir.py" --memory-report reports/ir-performance/before-memory.json
          python tools/bench_ir.py --memory-report reports/ir-performance/after-memory.json
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ir-performance
          path: reports/ir-performance/

  slo-gate:
    name: 7 · Pass-time SLO gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: pip install -e "./packages/pycompose[dev]" -e ./packages/pycompose-cli -e ./packages/pycompose-codegen -e ./packages/pycompose-testing
      - name: Measure the base commit and the change on this runner
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          # Every package in the checkout it runs in, or the root before there were any.
          install() {
            local args=(-e .)
            if [ -d packages ]; then
              args=()
              for d in packages/*/; do args+=(-e "$d"); done
            fi
            pip install -q "${args[@]}"
          }
          base="${PR_BASE:-$PUSH_BASE}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          git worktree add --detach "$RUNNER_TEMP/slo-base" "$base"
          cp tools/slo.py "$RUNNER_TEMP/slo-base/tools/slo.py"
          mkdir -p reports/slo
          # A base older than the view model runtime cannot run this
          # measurement; then there is nothing to compare against.
          if (cd "$RUNNER_TEMP/slo-base" && install && python tools/slo.py measure -o "$GITHUB_WORKSPACE/reports/slo/before.json"); then
            echo "measured=true" >> "$GITHUB_ENV"
          else
            echo "::notice::the base commit predates the SLO measurement; gate skipped"
          fi
          install
          python tools/slo.py measure -o reports/slo/after.json
      - name: Fail on a regression over 20%
        if: env.measured == 'true'
        run: python tools/slo.py check reports/slo/before.json reports/slo/after.json
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slo
          path: reports/slo/

  device-slo-gate:
    name: 8 · Tap-to-frame SLO gate (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;34.0.0"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check out the base commit
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BASE}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          git worktree add --detach "$RUNNER_TEMP/slo-base" "$base"
          mkdir -p reports/device-slo
      # The base and the change run on one emulator, one after the other, so
      # they are measured on the same machine. A base that cannot build the
      # notes app or log its passes leaves nothing to compare against.
      - name: Measure tap to frame, base commit then change
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            (cd "$RUNNER_TEMP/slo-base" && pip install -q $(if [ -d packages ]; then for d in packages/*/; do printf -- '-e %s ' "$d"; done; else echo '-e .'; fi) && cd examples/notes && pycompose debug --no-launch && python "$GITHUB_WORKSPACE/tools/slo.py" device -o "$GITHUB_WORKSPACE/reports/device-slo/before.json") || echo "::notice::the base commit cannot run the device measurement; gate skipped"
            pip install -q $(if [ -d packages ]; then for d in packages/*/; do printf -- '-e %s ' "$d"; done; else echo '-e .'; fi) && cd examples/notes && pycompose debug --no-launch && python ../../tools/slo.py device -o ../../reports/device-slo/after.json
      - name: Fail on a regression over 20%
        run: |
          if [[ -f reports/device-slo/before.json ]]; then
            python tools/slo.py check reports/device-slo/before.json reports/device-slo/after.json --floor-ms 5
          fi
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-slo
          path: reports/device-slo/

  kotlin-lint-test-archunit:
    name: 3 · Kotlin lint · tests · ArchUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - if: hashFiles('android/settings.gradle.kts') != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VERSION }}
      - if: hashFiles('android/settings.gradle.kts') != ''
        uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;34.0.0"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install the package (the render gate writes its samples with it)
        run: |
          uv sync --all-packages --all-extras --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Spotless + Detekt + lint + unit tests (incl. ArchUnit)
        if: hashFiles('android/settings.gradle.kts') != ''
        working-directory: android
        run: ./gradlew spotlessCheck detekt lintDebug testDebugUnitTest --continue
      - name: Trace validation (recorded host runs against the TLA+ model)
        if: hashFiles('android/settings.gradle.kts') != ''
        run: python tools/spec/trace.py android/host/build/traces
      - name: Verify pinned public Compose inventory
        env:
          PYCOMPOSE_NATIVE_API_TESTS: "1"
        run: |
          pytest -q packages/pycompose-codegen/tests/derive/test_classpath_dump.py packages/pycompose-codegen/tests/derive/test_component_proposals.py packages/pycompose-codegen/tests/derive/test_composegen.py
          python -m pycompose_codegen.derive.classpath_dump --report android/build/compose-api/capabilities.json
          python -m pycompose_codegen.derive generate --check
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-reports
          path: |
            android/**/build/reports/
            android/build/compose-api/

  build-template-smoke:
    name: 4 · Template build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - if: hashFiles('android/settings.gradle.kts') != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VERSION }}
      - if: hashFiles('android/settings.gradle.kts') != ''
        uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;34.0.0"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install CLI
        run: |
          uv sync --all-packages --all-extras --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Generate sample project
        run: |
          cd "$RUNNER_TEMP"
          pycompose init smoke
      - name: Verify generated Python entrypoint
        working-directory: ${{ runner.temp }}/smoke/app
        run: |
          python - <<'PY'
          from pycompose.bridge.session import compose_once
          snapshot, error = compose_once("main:app")
          assert snapshot and not error, error
          PY
      - name: Verify installed wheel CLI and template assets
        run: |
          uv build --all-packages --out-dir "$RUNNER_TEMP/cli-wheel"
          python -m venv "$RUNNER_TEMP/cli-venv"
          # Install like a user: the CLI has a runtime dependency (rich), and a
          # --no-deps install produced a wheel that could not import.
          "$RUNNER_TEMP/cli-venv/bin/python" -m pip install "$RUNNER_TEMP"/cli-wheel/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/cli-venv/bin/pycompose" init wheel-smoke
          cd wheel-smoke
          "$RUNNER_TEMP/cli-venv/bin/pycompose" sync
          "$RUNNER_TEMP/cli-venv/bin/pycompose" sync --check
          cd ..
          "$RUNNER_TEMP/cli-venv/bin/python" -I - <<'PY'
          import sys
          import tomllib
          from pathlib import Path
          project = Path("wheel-smoke")
          config = tomllib.loads((project / "pycompose.toml").read_text())
          assert config["python"]["entrypoint"] == "main:app"
          assert (project / ".gitignore").is_file()
          assert {p.name for p in project.iterdir() if not p.name.startswith(".")} == {
              "app", "resources", "pycompose.toml"
          }
          for resource in ("assets", "drawables", "fonts"):
              assert (project / "resources" / resource).is_dir()
          sys.path.insert(0, str(project / "app"))
          import main
          from pycompose.wire import emit_ir, validate_ir
          from pycompose.wire.generated_validators import SCHEMA_VERSION
          candidate = emit_ir(main.app.build(route="home"), SCHEMA_VERSION)
          assert validate_ir(candidate).snapshot is candidate
          assert not any(name.startswith("pycompose_cli.templates") for name in sys.modules)
          from pycompose.wire import to_json_bytes
          (project / "ui.json").write_bytes(to_json_bytes(candidate))
          PY
          "$RUNNER_TEMP/cli-venv/bin/pycompose" validate wheel-smoke/ui.json
      - name: Build template (host debug APK)
        if: hashFiles('android/settings.gradle.kts') != ''
        working-directory: ${{ runner.temp }}/wheel-smoke
        run: |
          "$RUNNER_TEMP/cli-venv/bin/pycompose" build apk
          apk=".pycompose/android/host/build/outputs/apk/debug/host-debug.apk"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" > badging.txt
          grep -F "package: name='com.example.app_wheel_smoke' versionCode='1' versionName='0.1.0'" badging.txt
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify "$apk"
          python - <<'PY'
          import io
          import zipfile

          apk = ".pycompose/android/host/build/outputs/apk/debug/host-debug.apk"
          with zipfile.ZipFile(apk) as archive:
              for abi in ("arm64-v8a", "x86_64"):
                  assert f"lib/{abi}/libpython3.12.so" in archive.namelist()
              # Compiled evidence, not file existence (plan 17, step 8.3): the
              # sample's slice is Text plus the framework floor, so an unused
              # component's model must not be in the dex a device would run.
              dex = b"".join(
                  archive.read(name)
                  for name in archive.namelist()
                  if name.startswith("classes") and name.endswith(".dex")
              )
              assert b"Lcom/pycompose/ir/generated/TextProps;" in dex
              assert b"Lcom/pycompose/ir/generated/SliderProps;" not in dex
              # ...and the app's own m3 must be the only component catalog the
              # APK packs for Python; `pycompose build` excluded the library's.
              # Chaquopy ships app sources as .py, or as sibling .pyc bytecode
              # when the build machine can compile them (it then drops the .py
              # sources), so either form proves the slice is what got packed.
              with zipfile.ZipFile(
                  io.BytesIO(archive.read("assets/chaquopy/app.imy"))
              ) as runtime:
                  packaged = runtime.namelist()
              assert {"m3/__init__.py", "m3/__init__.pyc"} & set(packaged), sorted(
                  packaged
              )
              library = ("pycompose/foundation/", "pycompose/material3/")
              assert not any(name.startswith(library) for name in packaged), sorted(
                  packaged
              )
              # No tool ships: they are other distributions, never staged.
              tools = ("pycompose_cli/", "pycompose_codegen/", "pycompose_testing/")
              assert not any(name.startswith(tools) for name in packaged), sorted(
                  packaged
              )
          PY

  resource-sync-check:
    name: 5 · Resource sync --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install CLI
        run: |
          uv sync --all-packages --all-extras --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Sync check
        if: hashFiles('packages/pycompose-cli/src/pycompose_cli/commands/sync.py') != ''
        run: |
          cd "$RUNNER_TEMP"
          pycompose init sync-smoke
          cd sync-smoke
          pycompose sync
          pycompose sync --check

  hot-reload-smoke:
    name: 6 · Dev-server hot reload smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install CLI
        run: |
          uv sync --all-packages --all-extras --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Hot reload smoke
        run: pytest -q -m "hot_reload_smoke"
