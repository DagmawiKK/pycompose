# Boundary contracts for the Notes example.
#
# A separate file from the root pyproject.toml because import-linter resolves
# one root package per configuration, and an app is not part of the library.
# `make lint-py` runs both.
#
# Phase 5 generates this from the app's structure instead of maintaining it by
# hand. Until then it is checked in, which means a layer added to the example
# that breaks one of these fails the build rather than the review.

[tool.importlinter]
root_package = "notes_app"
include_external_packages = true

# The feature stack, top to bottom: a screen draws its view model's state and
# carries its intents, a view model opens routes. Nothing points back up, so no
# view model knows what its screen looks like.
#
# `domain` is not in this list and that is deliberate. Every layer may import
# the domain -- that is the point of it -- so putting it at the bottom would make
# every direct import of a use case an illegal skip. It gets its own contract
# below, restricting what it may reach rather than who may reach it.
[[tool.importlinter.contracts]]
name = "Example: views -> view_models -> routes"
type = "layers"
layers = ["views", "view_models", "routes"]
containers = ["notes_app"]
explanation = "A screen draws a view model's state, a view model opens routes. No layer may reach one above it."

# A feature reaches storage through a use case, never around one; only the
# container names a backend.
[[tool.importlinter.contracts]]
name = "Example: features never import data directly"
type = "forbidden"
source_modules = ["notes_app.views", "notes_app.view_models", "notes_app.routes"]
forbidden_modules = ["notes_app.data"]
explanation = "A screen or a view model that named a backend would be untestable without one."

# The rule that makes the domain a domain: it cannot see the app it belongs to.
[[tool.importlinter.contracts]]
name = "Example: domain is independent"
type = "forbidden"
source_modules = ["notes_app.domain"]
forbidden_modules = [
  "notes_app.views",
  "notes_app.view_models",
  "notes_app.routes",
  "notes_app.container",
]
explanation = "Use cases are plain functions over plain data; nothing in domain/ may reach back into the app that uses it."

# The whole reason to test the domain separately. Without this contract a single
# convenience import in domain/ would quietly pull in the entire runtime.
[[tool.importlinter.contracts]]
name = "Example: domain never imports the framework"
type = "forbidden"
source_modules = ["notes_app.domain"]
forbidden_modules = ["pycompose"]
explanation = "The rules of the app must run with no library at all; that is what makes them fast to test and honest about their dependencies."

# Storage answers the domain and nothing else. A backend that knew about a screen
# would be unable to serve a second one.
[[tool.importlinter.contracts]]
name = "Example: data implements storage, not features"
type = "forbidden"
source_modules = ["notes_app.data"]
forbidden_modules = ["notes_app.views", "notes_app.view_models", "notes_app.routes"]
explanation = "A backend that referenced a screen could only ever serve that screen."
